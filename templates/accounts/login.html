{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-4 col-md-offset-4">
    <h2 class="page-header">Entrar</h2>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-brand btn-block"><span class="glyphicon glyphicon-log-in"></span> Entrar</button>
    </form>
    <p class="text-center" style="margin-top:15px">Ainda não tem conta? <a href="{% url 'accounts:register' %}">Cadastre-se</a></p>
  </div>
</div>
{% endblock %}
